# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9696
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
  error:
    whitelabel:
      enabled: false
    include-exception: on
    include-stacktrace: always

spring:
  profiles:
    active: @profiles.active@

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /res/*,/profile/*
  # 匹配链接
  urlPatterns: /column/*,/article/*,/page/*,/view/*

